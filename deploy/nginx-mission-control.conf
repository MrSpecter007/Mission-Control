# Mission Control — nginx vhost
# 1. Copy to /etc/nginx/sites-available/mission-control.conf
# 2. symlink: ln -s /etc/nginx/sites-available/mission-control.conf /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# 4. For SSL: certbot --nginx -d mc.catalystdv.com

server {
    listen 80;
    listen [::]:80;
    server_name mc.catalystdv.com;   # change to your subdomain

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_redirect     off;
        proxy_read_timeout 120s;
    }
}
